function nextQuestion(){session.index++;if(session.index>=session.questions.length)finishGame();else renderQuestion()}
function finishGame(){if(!session)return;const key=`${session.mode}|${selectedMajor}`;store.best[key]=Math.max(store.best[key]||0,session.score);saveStore();const elapsed=Math.max(1,Math.round((Date.now()-session.started)/1000));const finished=session;session=null;showView("result");renderResult(finished,elapsed)}
function renderResult(s,elapsed){const first=s.results.filter(r=>r.correct).length;const misses=s.results.filter(r=>!r.correct),scopeName=GAME_CONFIG.label||(selectedMajor==="all"?"全课程":chapterLabel(selectedMajor));$("resultHost").innerHTML=`<div class="result-head">${icon("trophy")}<div class="result-score">${s.score}</div><h1>${esc(MODES[s.mode].name)}完成</h1><p>${esc(scopeName)} · ${s.results.length} 题 · 满分 100</p></div><div class="result-metrics"><div class="metric"><b>${Math.round(first/s.results.length*100)}%</b><span>首次正确率</span></div><div class="metric"><b>${Math.floor(elapsed/60)}:${String(elapsed%60).padStart(2,"0")}</b><span>用时</span></div><div class="metric"><b>${misses.length}</b><span>错题或查看答案</span></div></div><div class="review-list"><h2>本局回顾</h2>${misses.length?misses.map(r=>`<div class="review-item"><b>${esc(r.type)}</b><div>${esc(r.prompt)}</div><div>答案：${esc(r.answer)}</div></div>`).join(""):'<div class="review-item">本局所有题目均为首次答对。</div>'}</div><div class="result-actions"><button class="btn" id="resultHome">返回首页</button><button class="btn btn-primary" id="againBtn">再练一局</button></div>`;$("resultHome").onclick=goHome;$("againBtn").onclick=()=>startGame(s.mode)}
function goHome(){session=null;showView("home");updateHomeStats()}
function renderRecords(){const bestRows=visibleModeEntries().map(([id,m])=>{const values=Object.entries(store.best).filter(([k])=>k.startsWith(id+"|")).map(([,v])=>v);return`<div class="best-item"><span>${esc(m.name)}</span><b>${values.length?Math.max(...values):0}</b><span>历史最高 / 100</span></div>`}).join("");const wrongRows=Object.entries(store.wrong).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1]).slice(0,40).map(([id,n])=>{const e=byId.get(id);return e?`<tr><td>${esc(labelEntry(e))}</td><td>${esc(e.major)} · ${esc(e.minor)}</td><td>${n}</td></tr>`:""}).join("");$("recordsHost").innerHTML=`<h1>学习记录与错题本</h1><p>成绩与错题只保存在当前浏览器。</p><h2>各玩法最高分</h2><div class="best-grid">${bestRows}</div><div class="records-actions"><h2>错题本</h2><button class="btn btn-danger" id="clearAsk">${icon("trash")}清空记录</button></div>${wrongRows?`<table class="wrong-table"><thead><tr><th>内容</th><th>章节 · 分类</th><th>需复习次数</th></tr></thead><tbody>${wrongRows}</tbody></table>`:'<div class="empty"><p>目前没有错题记录。</p></div>'}`;$("clearAsk").onclick=()=>{if(!confirm("确定清空本浏览器中的最高分、错题和掌握记录？"))return;safeStorage.removeItem(STORAGE_KEY);store=loadStore();renderRecords();updateHomeStats();announce("学习记录已清空")}}
function updateHomeStats(){const best=Object.values(store.best),wrong=Object.values(store.wrong).reduce((sum,count)=>sum+Math.max(0,count||0),0),badge=$("wrongBadge");if(GAME_CONFIG.theorySection){$("heroEntries").textContent=DB.basicConcept.length;$("heroEntriesLabel").textContent="专项题目";$("heroCases").textContent=visibleModeEntries().length;$("heroCasesLabel").textContent="可用玩法";$("coverageText").textContent=`收录 ${DB.basicConcept.length}\u00a0道${GAME_CONFIG.label}专项题`}else{$("heroEntries").textContent=entries.length;$("heroEntriesLabel").textContent="方剂与中成药";$("heroCases").textContent=DB.case.length;$("heroCasesLabel").textContent="病例与应用";$("coverageText").textContent=GAME_CONFIG.locked?`收录 ${DB.formula.length}\u00a0首经典方剂、${DB.patentMedicine.length}\u00a0种中成药、${DB.case.length}\u00a0道应用题、${DB.comparison.length}\u00a0组辨析`:`收录 ${DB.basicConcept.length}\u00a0道总论题、${DB.formula.length}\u00a0首经典方剂、${DB.patentMedicine.length}\u00a0种中成药、${DB.comparison.length}\u00a0组辨析`}$("heroBest").textContent=best.length?Math.max(...best):0;badge.textContent=wrong>99?"99+":wrong;badge.hidden=wrong===0;$("recordsBtn").setAttribute("aria-label",wrong?`查看学习记录与错题本，${wrong} 项待复习`:"查看学习记录与错题本")}
function modeCounts(){const p=pools(),counts={};for(const id of Object.keys(MODES))counts[id]=id==="mixed"?["case","compose","match","triple","classify","compare","basic"].reduce((n,key)=>n+p[key].length,0):(p[id]?.length||0);return counts}
function visibleModeEntries(counts=modeCounts()){let candidates;if(selectedMajor==="总论")candidates=Object.entries(MODES).filter(([id])=>GAME_CONFIG.locked?["conceptMatch","memory"].includes(id):id==="basic");else candidates=Object.entries(MODES).filter(([id])=>!["basic","conceptMatch","memory"].includes(id));return GAME_CONFIG.locked?candidates.filter(([id])=>counts[id]>0):candidates}
function renderModes(){const counts=modeCounts(),visible=visibleModeEntries(counts);$("modeGrid").dataset.count=visible.length;$("modeGrid").innerHTML=visible.map(([id,m])=>{const available=counts[id]>0,count=selectedMajor==="all"?10:Math.min(10,counts[id]);return`<button class="mode-card ${m.primary?"primary":""}" data-mode="${id}" ${available?"":"disabled"} aria-disabled="${available?"false":"true"}" aria-label="${esc(m.name)}，${available?`本局 ${count} 题`:"本章暂无题目"}"><span class="mode-icon">${icon(m.icon)}</span><span><h3>${esc(m.name)}</h3><p>${available?`${esc(m.tag)} · ${count} 题`:"本章暂无这类题目"}</p></span><span class="arrow">${available?icon("right"):""}</span></button>`}).join("");document.querySelectorAll("[data-mode]:not(:disabled)").forEach(b=>b.onclick=()=>startGame(b.dataset.mode))}
function updateChapterSummary(){if(GAME_CONFIG.summary){$("chapterSummary").textContent=GAME_CONFIG.summary;return}if(selectedMajor==="all"){$("chapterSummary").textContent="全课程综合内容 · 含总论";return}if(selectedMajor==="总论"){$("chapterSummary").textContent="总论 · 方剂与中成药概述、方剂基础理论、中成药基础知识";return}const entryCount=scopedEntries().length;const caseCount=DB.case.filter(c=>(c.origin||"case")==="case"&&c.major===selectedMajor).length;$("chapterSummary").textContent=`${chapterLabel(selectedMajor)}章节 · ${entryCount} 项方药${caseCount?` · ${caseCount} 个病例`:""}`}
function renderHome(){$("chapterSelect").innerHTML=`<option value="all">全部章节</option>${CHAPTERS.map(item=>`<option value="${esc(item.value)}">${esc(item.label)}</option>`).join("")}`;$("chapterSelect").value=selectedMajor;$("chapterPicker").hidden=!!GAME_CONFIG.locked;renderModes();updateChapterSummary();updateHomeStats()}
function showAudit(){const excluded=AUDIT.excludedConflicts?.length||0,blocked=AUDIT.qualityChecks?.blockedFields||0,nonTcm=AUDIT.excludedNonTcmEntries?.length||0;if(GAME_CONFIG.locked){const scope=GAME_CONFIG.theorySection?`${AUDIT.basicConceptCount} 道专项题`:`${AUDIT.entryCounts.formula} 首经典方剂、${AUDIT.entryCounts.patentMedicine} 种中成药、${AUDIT.caseCount} 个病例/应用、${AUDIT.comparisonCount} 组类方辨析`;alert(`${GAME_CONFIG.label}专项\n\n本文件收录：${scope}。\n\n每条知识均保留资料名称和页码；没有可靠依据、存在冲突或可能多解的字段不会出题。`);return}alert(`内容来源：${AUDIT.sourceFiles} 份文件（PPT ${AUDIT.sourceCounts.pptx}，讲稿 ${AUDIT.sourceCounts.docx}）\n\n实际收录：${AUDIT.entryCounts.formula} 首经典方剂、${AUDIT.entryCounts.patentMedicine} 种中成药、${AUDIT.basicConceptCount} 道总论题、${AUDIT.caseCount} 个病例/应用、${AUDIT.comparisonCount} 组可出题类方对比。\n\n总论包括：方剂与中成药概述、方剂基础理论、中成药基础知识。\n\n有明确字段：组成 ${AUDIT.fieldCoverage.composition}、君药 ${AUDIT.fieldCoverage.monarch}、功效 ${AUDIT.fieldCoverage.effects}、主治 ${AUDIT.fieldCoverage.indications}、临床应用 ${AUDIT.fieldCoverage.clinical}。\n\n已停用的相邻页、多解或异常字段：${excluded} 条；质量门禁拦截 ${blocked} 条；另排除不属于方剂或中成药的条目 ${nonTcm} 个。没有可靠依据的字段不会出题。`) }
$("chapterSelect").onchange=e=>{if(GAME_CONFIG.locked)return;selectedMajor=e.target.value;updateChapterSummary();renderModes();updateHomeStats()};$("homeBtn").onclick=()=>{if(session&&!confirm("本局尚未结束，确定返回首页？"))return;goHome()};$("recordsBtn").onclick=()=>{dismissGuide();session=null;showView("records");renderRecords()};$("dismissGuide").onclick=dismissGuide;$("quitBtn").onclick=()=>{if(confirm("确定结束本局并返回首页？"))goHome()};$("auditBtn").onclick=showAudit;
document.addEventListener("keydown",e=>{if(screen!=="game"||session?.complete)return;if(/^[1-9]$/.test(e.key)){const buttons=[...document.querySelectorAll("[data-choice],[data-multi],[data-tile],[data-memory]")];buttons[Number(e.key)-1]?.click()}else if(e.key==="Enter")document.querySelector("[data-submit]")?.click()});
renderHome();updateHeader();syncGuide();
window.__gameTest={config:GAME_CONFIG,start:startGame,home:goHome,get state(){return session},get store(){return store},storageKey:STORAGE_KEY,guideKey:GUIDE_KEY,currentPools(){return pools()},allPools(){const previous=selectedMajor;selectedMajor=GAME_CONFIG.locked?(GAME_CONFIG.major||previous):"all";const result=pools();selectedMajor=previous;return result},answerCurrent(value){const q=current();if(!q)return false;if(q.kind==="mc"){document.querySelector(`[data-choice="${CSS.escape(String(value??q.answer))}"]`)?.click();return true}if(q.kind==="multi"){(value||q.answer).forEach(v=>document.querySelector(`[data-multi="${CSS.escape(v)}"]`)?.click());document.querySelector("[data-submit]")?.click();return true}return false},clear(){safeStorage.removeItem(STORAGE_KEY);store=loadStore();updateHomeStats()}};
</script>
</body>
</html>
